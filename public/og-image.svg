    <radialGradient id="portraitGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(994 315) rotate(90) scale(164)">
      <stop stop-color="#17395F" stop-opacity="0.65" />
      <stop offset="1" stop-color="#17395F" stop-opacity="0" />
    </radialGradient>
    <clipPath id="portraitClip">
      <circle cx="994" cy="315" r="122" />
