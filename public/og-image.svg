  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="42" y="42" width="1116" height="546" rx="28" stroke="url(#accent)" stroke-opacity="0.4" stroke-width="2" />

  <circle cx="994" cy="315" r="164" fill="url(#portraitGlow)" />
  <circle cx="994" cy="315" r="136" stroke="url(#accent)" stroke-width="4" />
  <g clip-path="url(#portraitClip)">
